name: App CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run qa:fixture
      - run: npm test
      - run: npm run build
      - run: npm run site:build && npm run site:check
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-editor-ci.mjs
      - run: OIDC_BROWSER_TEST=1 node --test test/web-oidc.test.mjs
      - run: docker build -t stamp-book:ci .
      - run: node scripts/verify-container.mjs
  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tags<<END_TAGS" >> "$GITHUB_OUTPUT"
          echo "$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then echo "$image:$REF_NAME" >> "$GITHUB_OUTPUT"; else echo "$image:main" >> "$GITHUB_OUTPUT"; fi
          echo "END_TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Package deployment files
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir deployment
          cp compose.yaml compose.oidc.yaml .env.example .env.oidc.example deployment/
          cp docs/web-app/oidc.md deployment/oidc.md
          cp docs/web-app/deployment.md deployment/README.md
          printf 'STAMP_BOOK_IMAGE=%s@%s\n' "$IMAGE" "$DIGEST" > deployment/image.env
          printf '%s\n' "$GITHUB_SHA" > deployment/COMMIT
          cd deployment
          sha256sum compose.yaml compose.oidc.yaml .env.example .env.oidc.example oidc.md README.md image.env COMMIT > SHA256SUMS
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stamp-book-deploy-${{ github.sha }}
          path: deployment/
          include-hidden-files: true
          retention-days: 90
